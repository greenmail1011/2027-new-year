:root{
  color-scheme:light;
  --bg:#F5F7F4; --surface:#FFFFFF; --ink:#1F2622; --muted:#5F6A63; --line:#E0E5DF;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;margin:0}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
header.top{display:grid;gap:10px;padding-bottom:18px}

.hero img{display:block;width:100%;height:auto;aspect-ratio:1200/630;object-fit:cover}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--serif);font-size:clamp(28px,6vw,40px);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:.02em}
h1 .mark{color:var(--accent)}
.vrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--muted)}
.pill{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:13px;background:var(--surface)}
.vrow a{color:var(--accent);text-underline-offset:3px}
.music-link{display:inline-flex;align-items:center;gap:.28em;margin:0;padding:0;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;white-space:nowrap;cursor:pointer}
.music-link::after{content:"▶";display:inline-grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;background:var(--accent);color:#fff;font-size:.62em;line-height:1}
.music-link:hover{color:#8F251E}
.music-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.music-link[aria-current="true"]{color:var(--act)}
.music-link[aria-current="true"]::after{content:"♪";background:var(--act)}
.musicdock{position:fixed;z-index:20;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,calc(100% - 24px));padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.97);box-shadow:0 12px 38px rgba(31,38,34,.25);backdrop-filter:blur(12px)}
.musicdock-inner{display:grid;grid-template-columns:minmax(90px,auto) minmax(180px,1fr) auto;gap:10px;align-items:center}
.musicnow{display:grid;line-height:1.3}.musicnow small{color:var(--muted)}.musicnow strong{color:var(--ink)}
.musicdock audio{display:block;width:100%;height:36px}
.musicclose{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);font:inherit;font-size:20px;line-height:1;cursor:pointer}
body.has-music .wrap{padding-bottom:150px}
@media(max-width:520px){.musicdock-inner{grid-template-columns:1fr auto}.musicdock audio{grid-column:1/-1;grid-row:2}.musicnow{min-width:0}}
.intro{font-size:15px;color:var(--muted);display:grid;gap:4px}
.intro p{margin:0}
.intro strong{color:var(--ink)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:grid;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}

button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.editbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--edit);border:1px solid #F0DFA0;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink)}
.editbar .msg{flex:1 1 220px}
.notice{border-radius:10px;padding:8px 12px;font-size:14px;background:var(--accent-soft);color:var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.part{margin-top:30px}
.part h2{font-family:var(--serif);font-size:24px;margin:0 0 10px;display:flex;align-items:baseline;gap:12px}
.plabel{font-family:var(--sans);font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:500}
.appx h2{color:var(--muted)}

details.l3{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.l3 + details.l3{margin-top:10px}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 0}
summary::-webkit-details-marker{display:none}
.st{font-family:var(--serif);font-weight:600;font-size:18px;flex:1;text-wrap:balance}
details.l4 > summary .st{font-size:16px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:0 9px;white-space:nowrap}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none;margin:0 4px 4px}

.body{padding:0 0 16px;display:grid;gap:6px}
details.l4{background:var(--bg);border-radius:10px;padding:0 12px}
details.l4 + details.l4{margin-top:8px}

p{margin:0}
.line{padding:4px 8px;border-radius:6px;transition:opacity .2s,background-color .2s}
.dlg{display:grid;grid-template-columns:4.4em 1fr;gap:12px;align-items:baseline}
.dlg.long{grid-template-columns:1fr;gap:0}
.spk{font-family:var(--serif);font-weight:700;color:var(--ink);white-space:nowrap}
.dlg.long .spk{white-space:normal}
.spk .sub{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.act{color:var(--act);font-size:15px}
@media (min-width:560px){.act,.cueline{margin-left:calc(4.4em + 12px)}}
.cueline{font-size:14px;color:var(--muted)}
.cue{display:inline-block;font-size:.8em;line-height:1.5;color:var(--accent);border:1px solid #EDB5AE;background:#FFF7F5;border-radius:4px;padding:0 6px;margin:0 2px;vertical-align:1px}
.tone{color:var(--muted);font-size:.88em}
.tone::before{content:"〔"}.tone::after{content:"〕"}
.tr{display:block;color:var(--muted);font-size:13px;line-height:1.6}
.inact{color:var(--act);font-size:.92em}
h5.beat{margin:14px 0 2px;font-size:13px;letter-spacing:.08em;color:var(--accent);font-weight:700}
ul.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.steps li{display:grid;grid-template-columns:auto 1fr;gap:10px}
ul.steps li.plain{grid-template-columns:1fr}
.tc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap;padding-top:3px;min-width:5.6em}
ol{margin:0;padding-left:1.4em;display:grid;gap:4px}
ul.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.todo li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start}
.box{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;margin-top:6px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line);min-width:5em}
th{font-weight:700;color:var(--muted);font-size:13px;white-space:nowrap;background:#FAFBF9}
tr:last-child td{border-bottom:0}
strong{font-weight:700}
body.has-role .script .line.dim{opacity:.35}
body.has-role .script .line.hit{background:var(--hit);opacity:1}

/* 編輯模式 */
.src{display:block;outline:1px dashed #C9CFC8;border-radius:6px;background:var(--edit);padding:4px 8px;white-space:pre-wrap;cursor:text}

body.editing .act,body.editing .cueline{margin-left:0}
.hint-wide{display:none}

.src:focus{outline:2px solid var(--accent);background:#fff}

.edrow{display:flex;gap:8px;align-items:flex-start}
.edrow > .grow{flex:1;min-width:0}
.edt{display:flex;gap:4px;flex:none;opacity:.55}
.edrow:hover .edt,.edrow:focus-within .edt{opacity:1}

.eb:hover{color:var(--accent);border-color:var(--accent)}
.spsel{font:inherit;font-family:var(--serif);font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:1px 2px;max-width:100%}
.changed{box-shadow:inset 3px 0 0 #E2B23C}

/* Firebase 同步與修改紀錄 */
.sync{color:var(--act)}
.sync.off{color:var(--accent)}
#who .tool{padding:0 2px}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;max-height:50vh;overflow:auto}
.histhead{display:flex;gap:8px;align-items:baseline}

.hist ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}

.namef input{font:inherit;font-size:14px;width:9em;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--surface);color:var(--ink)}

/* 會議討論重點 */
.focus{background:#FFF8E6;border:1px solid #F0DFA0;border-left:4px solid #E2B23C;border-radius:10px;padding:10px 14px;margin:2px 0 10px;font-size:15px;line-height:1.7;display:grid;gap:4px}
.focus .fhead{font-weight:700;color:#8A5A00;font-size:14px;letter-spacing:.03em}

.focus li::marker{color:#C9962A}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script type="application/json" id="src">{"version": "第三版（精修排練版）", "edited": "2026/9/26 第三版", "md": "# 《老壇主的時光廚房》2027新春團拜版｜第三版（精修排練版）\n\n版本：2026-09-26 第三版（精修排練版）\n\n\n\n## 第一部分｜劇本\n\n### 演出總覽\n\n| 段落 | 時間 | 長度 | 誰在台上 |\n| --- | --- | --- | --- |\n| 一、威武門神登場 | 00:00–01:00 | 1:00 | 主門神 2 位 |\n| 二、歡樂大掃除 | 01:00–03:00 | 2:00 | 阿嬤一家、大掃除群演；場下小門神 |\n| 三、溫馨家庭話劇 | 03:00–11:25 | 約 8:25 | 阿嬤一家、春嬌、主門神 2 位 |\n| 四、歡樂門神壓軸 | 11:25–13:55 | 2:30 | 門神 10 位＋小門神 2 位、話劇演員 |\n| 全場發放禮品 | 13:55 起 | 視人數 | 門神、發送組 |\n\n### 角色一覽\n\n| 角色 | 演員 | 一句話 |\n| --- | --- | --- |\n| 陳老壇主（阿嬤） | 李冠德（反串） | 做蘿蔔糕結善緣，帶全家去家訪 |\n| 阿誠（爸爸） | 【待確認】 | 阿嬤的兒子，憨厚、負責出力跑腿 |\n| 麗玲（媽媽） | 蔡梅烽（依原表括註） | 阿嬤的媳婦，開朗、會安排分工 |\n| 小寶（孫子） | 【待確認】 | 愛吃，「吹蘿蔔糕」「邊邊」笑點 |\n| 妞妞（孫女） | 蘇湘澄 | 細心、愛幫忙 |\n| 春嬌（受家訪者） | 張素環 | 巷口默默行善的鄰居道親 |\n| 主門神甲、乙 | 黃家倍、彭永才（編排假設，待確認） | 阿嬤家的門神，無聲 |\n| 門神群、小門神 | 見附錄 D | 壓軸登場，無聲 |\n\n### 第一階段｜威武門神登場（1:00）\n\n> **會議討論重點｜第一階段：威武門神登場（開場亮相）**\n> - 出場人員：由 2 位主門神（正門神，挑選身高相近的壇主，如家倍壇主、治中壇主）率先亮相。\n> - 表演內容：帶來約 1~1.5 分鐘莊嚴威武的登場舞蹈（音樂採新春揚琴正氣風格）。\n> - 動線定位：跳完舞蹈後，2 位主門神會移動並站立於舞台兩側守護一段時間，為整場節目拉開莊嚴鎮守的序幕。\n\n【舞台淨空。主門神甲（黃家倍）在左側翼、主門神乙（彭永才）在右側翼候場。】\n\n【M1 門神威武版起。】\n\n- 0:00–0:08｜揚琴前奏，舞台空著，讓觀眾安靜下來。\n- 0:08–0:18｜【上】兩位主門神自左右兩側同時上場，踏著重拍一拍一步走大台步，在中央相距兩步處面對面停下。\n- 0:18｜頓挫點 1：兩人同時轉向觀眾、抱拳。【定格 1】\n- 0:20–0:40｜對稱武術動作兩個八拍：弓步推掌 → 轉身甩披風 → 手勢或兵器道具高舉（依服裝道具組準備）→ 馬步。動作大、慢、穩，細節由江敏娟編排。\n- 0:40｜頓挫點 2：背靠背亮相。【定格 2】\n- 0:42–0:52｜兩人踏台步回到舞台中央，肩並肩面向觀眾，雙臂交叉在胸前，成為「兩扇關著的大門」。阿嬤趁這段時間從左側翼彎腰躲到兩人身後（能不能遮住，由江敏娟與戲劇組在彩排時確認）。\n- 0:52–1:00｜頓挫點 3：兩人以外側的腳為軸，像兩扇門板一樣同時向外旋開（甲向左、乙向右），停在開門迎客的手勢，阿嬤就站在門中間。【定格 3：開門】【M1 收】\n\n（替代做法：阿嬤遮不住時不躲在門後，改在開門那一拍從左側翼大步走進兩人中間。之後主門神在第二階段前奏退到守護位（甲在舞台左前緣、乙在舞台右前緣，不擋到左區、右區與中央，彩排時貼地標），直到 3-1 結尾。沒有指定動作時，可收成較放鬆的「站班姿」：雙手交疊、目視前方、不走動。）\n\n### 第二階段｜歡樂大掃除（2:00）\n\n> **會議討論重點｜第二階段：日常生活與歡樂大掃除**\n> - 舞台上方：由全體壇辦登場，手持清潔道具（掃帚、拖把、抹布）進行約 2~3 分鐘熱鬧的恰恰大掃除舞蹈。\n> - 場下／周邊：其餘門神（小門神／巡視組，約 6~8 位）會騎著滑板車（或推雪車）在場下巡視穿梭，創造台上下同時動態互動的熱鬧氛圍。\n> - 動線銜接：在大掃除舞蹈尾聲時，場下巡視的門神會順勢退至幕後，準備銜接第三階段的話劇演出。\n\n【M2 大掃除恰恰起。前奏雞啼。】\n\n- 0:00–0:05｜M1 開門的最後一拍直接接 M2 前奏。阿嬤拿雞毛撢子從門中間跨出一大步，對左側翼拍兩下手。兩位主門神同時退到左右前緣守護位。落拍定格。【定格：守護姿】\n\n阿嬤：〔拉高嗓門〕起床囉！年欲到囉，大掃除啦！〔譯：年要到了〕\n\n- 0:05–0:20｜【上】阿誠（拖把）、麗玲（抹布）、小寶、妞妞（小掃把）從左側小跑步上場，在中央前排兩兩面對面，跳恰恰基本步。阿嬤在最前面拿雞毛撢子當指揮棒打拍子。\n- 0:20–0:50｜主歌一。【上】群演第一組（拿掃帚）從右側恰恰進場，排在後排。歌詞唱到掃地時，第一組做掃地動作，其他人繼續恰恰。\n- 0:50–1:20｜主歌二接副歌。【上】群演第二組（拿拖把、抹布）從左側進場。歌詞唱到擦、拖時換第二組做動作。副歌全體恰恰轉一圈。\n- 副歌時的門神小笑點：主門神乙的腳偷偷跟著恰恰點兩下，主門神甲轉頭看他一眼，乙馬上站回守護姿。只做一次，不搭舞蹈。\n- 1:20–1:40｜最後副歌：全體排成兩橫排，恰恰向前兩步、向後兩步；最後一拍全體舉起清潔用具亮相。【定格：大掃除完成】\n- 1:40–2:00｜尾奏＝換景（見下方）。\n\n**小門神場下巡視（0:20–1:40）**\n\n- 滑板車版：兩位小門神各從觀眾席後方兩側走道（依場地確認）低速滑入，沿走道向前。途中做「手搭眉檐遠望」的巡視動作、向觀眾抱拳。速度以步行為限，走道有人就停。\n- 替代版（不用滑板車）：同樣路線，改用「巡場台步」——每四拍走三步、第四拍轉頭左右看，偶爾停下對觀眾抱拳。\n- 1:40｜兩人到達舞台前緣，向台上主門神抱拳一禮，【下】從側邊回後台。滑板車由後台人員（待指定）在走道前端接手收走。\n\n**尾奏換景（1:40–2:00）**\n\n- 【下】群演拿著道具分左右下場，邊走邊向觀眾揮手。阿誠的拖把、麗玲的抹布、小寶妞妞的小掃把，交給經過的群演帶下。【道具交接】\n- 阿誠、麗玲從左側翼抬出長桌放在左區；小寶、妞妞各搬一張圓凳。阿嬤把雞毛撢子交給側翼後台人員，接過托盤（蒸籠與桌面小物）放上桌。\n- （可刪）春嬌拿小掃把從右側上，在右區前掃地，彎腰提起一袋回收，右手腕一痛，甩甩手、揉一下，改用左手提著回收【下】。無台詞。\n- 【M2 淡出。阿嬤一家在左區就位。】\n\n### 第三階段｜溫馨家庭話劇（約 8:25）\n\n> **會議討論重點｜第三階段：溫馨家庭話劇（積德善順）**\n> - 舞台劇情：講述老壇主阿嬤家大掃除與積善傳家的喜劇故事（約 12~15 分鐘）。\n> - 門神融入方式：門神會穿插於話劇中進行互動與對話。當人間劇情出現暫停或無聲狀態時，門神會出來顯靈巡視，稱讚這家人行善積德，並預告將福氣帶給這戶人家，隨後退至兩側或幕後。\n\n#### 3-1　阿嬤家的灶腳（約 3:00）\n\n【時間：過年前幾天的早上。地點：左區，阿嬤家灶腳。】\n\n【M3 灶腳襯底輕輕進（可選，音量壓低，不蓋過對白）。】\n\n（阿嬤站在桌後切蘿蔔糕；麗玲擦桌子、排保鮮盒；阿誠一手扶腰靠在桌邊；小寶、妞妞趴在蒸籠兩側。主門神甲、乙在舞台兩側守護位。）\n\n小寶：阿嬤～蘿蔔糕還要蒸多久？我的肚子在打鼓了！（拍肚子「咚、咚、咚」）\n\n阿嬤：乖孫，咱咧炊粿的時陣，毋通黑白講話喔！〔譯：我們蒸粿的時候，不可以亂講話喔〕\n\n小寶：〔一臉認真〕「吹」粿不能講話……（轉頭）妹！阿嬤說要用「吹」的！\n\n妞妞：真的喔？那我也來！\n\n（小寶、妞妞對著蒸籠嘟嘴用力吹。）\n\n小寶：呼～呼～呼～\n\n妞妞：呼～呼～呼～\n\n（主門神甲、乙的披風像被一陣風吹起，兩人身體往後一仰，趕緊用手壓住頭盔，再若無其事站回守護姿。人物都沒看見。）【笑點①：吹蘿蔔糕。停約 2 秒等笑聲】\n\n阿嬤：〔笑出來〕哎唷，阿嬤是講「炊」啦！炊，就是蒸！不是叫你們吹！\n\n阿誠：媽，你看，蒸氣都被他們吹跑了，這籠要蒸到明年了啦。\n\n妞妞：阿嬤說這是要送人的，我們只能吃邊邊。\n\n小寶：（雙手比一個好大的圓）那邊邊切厚一點——切得跟蒸籠一樣大！這樣算邊邊嗎？\n\n阿嬤：這樣是整籠啦！（摸摸兩人的頭）放心，阿嬤有多蒸兩籠，給你們兩隻小饞貓。【笑點②：邊邊跟蒸籠一樣大，停約 2 秒】\n\n阿誠：（揉腰）媽，每年都做這麼多，素粽、蘿蔔糕、甜年糕……你的腰不酸，我的腳都站成蘿蔔腿了。\n\n阿嬤：〔不抬頭，繼續切〕蘿蔔腿好啊！今年蘿蔔糕免買蘿蔔。〔譯：不用買蘿蔔〕【笑點③，停約 2 秒】\n\n（麗玲噗哧笑出來，把毛巾丟給阿誠擦汗。）\n\n麗玲：好啦，蘿蔔腿先生，來，盒子排好。媽這是在結善緣。\n\n阿嬤：修道毋是干焦佇佛堂叩首。人食甲歡喜，過年有溫暖，這嘛是布施。〔譯：修道不是只有在佛堂叩首。人家吃得歡喜，過年有溫暖，這也是布施〕\n\n（阿嬤把切好的蘿蔔糕放進保鮮盒，麗玲邊排邊點。）\n\n麗玲：明叔公一盒、佛堂一大盒……（停住）咦？媽，春嬌姐今年怎麼沒來拿？\n\n阿嬤：（刀子停下來）對喔。春嬌逐年攏第一个來鬥相共，今年哪會連人影都沒看到？〔譯：春嬌每年都是第一個來幫忙，今年怎麼連人影都沒看到〕\n\n妞妞：我昨天有看到春嬌阿姨！她在巷口掃地，手上綁著一個黑黑的東西。\n\n小寶：像護膝，可是綁在手上。\n\n麗玲：護腕？手扭到了？\n\n阿嬤：（放下刀，擦擦手）她每天幫明叔他們送便當，手扭到了還在掃巷口……這個人喔，自己的事攏囥上尾。〔譯：自己的事都放最後〕\n\n妞妞：阿嬤，那誰幫明叔公送便當？\n\n（全家安靜一拍。M3 若有，此時淡出。）\n\n阿嬤：（輕拍一下桌子）走！蘿蔔糕拄好炊好，咱來去春嬌兜看覓！〔譯：蘿蔔糕剛好蒸好，我們去春嬌家看看〕\n\n阿誠：現在？\n\n阿嬤：現在。欲相挺，毋是等人喊救命才去。〔譯：要幫人，不是等人家喊救命才去〕\n\n麗玲：好，我拿提袋。阿誠，蒸籠你搬。\n\n阿誠：〔苦笑〕蘿蔔腿又要出勤了。\n\n（麗玲把保鮮盒收進花布提袋；阿誠抬起蒸籠；阿嬤拿一個保鮮盒特別包好，用麥克筆在盒蓋上寫字。）\n\n小寶：阿嬤，那盒寫什麼？\n\n阿嬤：寫「春嬌」。阿嬤多放兩塊，一塊給她，一塊給她先生。\n\n【鏘——暫停鍵①】（全家定格：阿誠抱著蒸籠、麗玲提著提袋、小寶妞妞拉著阿嬤衣角、阿嬤手按在盒蓋上。）【揚琴短句，約 5 秒】\n\n（主門神甲、乙離開守護位，大步走到桌邊，一左一右彎腰看那盒蘿蔔糕。甲點點頭，對乙比了個大拇指；乙看一眼觀眾，輕輕把甲的大拇指按下去，換成抱拳。兩人一起對阿嬤抱拳一禮，退到全家身後，站成護送隊形。）【小笑點】\n\n【鏘——恢復】\n\n阿嬤：出發！\n\n【M4 過場短句起。】\n\n#### 轉場　巷子（約 0:25）\n\n（全家從左區走進中央「巷子」：阿誠抱蒸籠走前面，麗玲提提袋，小寶、妞妞一左一右牽著阿嬤。主門神甲、乙跟在後面兩步，左右張望，像兩位盡責的保鑣。）\n\n（同一時間，春嬌從右側上場：左手提菜籃，右手戴黑色護腕。她把矮凳放在右區門牌立架旁坐下，把六個便當盒一個個排在腳邊，拿起清單看。她不說話，專心在自己的事上。）【上：春嬌】\n\n（走到舞台中央，阿嬤突然停下。）\n\n阿嬤：等咧！〔譯：等一下〕\n\n（主門神甲差點撞上阿嬤的背，急煞；主門神乙一把拉住甲的披風。兩人立刻站好，抬頭假裝在看天空。阿嬤摸摸口袋，確認金羊還在，點點頭。）【小笑點】\n\n阿嬤：好，行！〔譯：好，走〕\n\n（全家繼續走，停在右區前方約兩步處。主門神甲、乙退到右區兩側後方站定，不擋春嬌與家人的臉。M4 淡出。）\n\n#### 3-2　春嬌家（約 4:30）\n\n【地點：右區，春嬌家門口與客廳。此段是全劇情感重心。除了暫停鍵②，門神都不動。】\n\n**① 進門：發現手傷**\n\n麗玲：（對著門牌立架敲三下【敲門聲，可現場敲桌面】）春嬌姐！\n\n春嬌：（急忙把護腕往袖子裡藏，站起來，做開門動作）來了來了——壇主？怎麼全家都來了！\n\n阿嬤：妳今年沒來拿蘿蔔糕，換阮送來。〔譯：換我們送來〕\n\n春嬌：哎呀，歹勢歹勢……（伸手要接蒸籠，右手一抬，痛得縮一下）\n\n麗玲：（馬上扶住她的手肘）手怎麼了？\n\n春嬌：沒事沒事，搬回收閃到一下而已。\n\n阿嬤：（輕輕把她按回矮凳）坐落來。〔譯：坐下來〕\n\n（阿誠把蒸籠放在春嬌旁邊的地上；麗玲放下提袋；小寶、妞妞蹲下來看那一排便當盒。）\n\n**② 春嬌的日常與困難**\n\n妞妞：阿姨，這些便當要給誰？\n\n春嬌：巷子裡的長輩。明叔、阿桃姨……孩子都在外地。除夕前，我想幫他們一人準備一份年菜。\n\n（小寶用手指一個一個點便當盒，點到最後一個，轉頭對阿誠比出「六」。阿誠睜大眼睛，看看春嬌的手，再看看便當盒。）\n\n（春嬌拿起清單看，又放下。）\n\n春嬌：本來都算好了。結果手扭到，菜刀都拿不穩。我先生年前跑貨運，天天半夜才回來，婆婆又交代年夜飯要十二道菜……\n\n（春嬌低下頭，聲音變小。全家安靜聆聽，沒有人插話。）\n\n春嬌：我也不是要誰謝謝我……只是有時候覺得，我做這些，好像都沒有人看見。\n\n【鏘——暫停鍵②】【揚琴單音，輕】（全家與春嬌定格。主門神甲、乙同時轉身面向春嬌，抱拳，深深一鞠躬，停住三秒，再慢慢站直回位。不加表情、不加動作、不做笑點。）【鏘——恢復】\n\n**③ 有人看見**\n\n阿嬤：（蹲到她身邊，輕輕握住她沒受傷的左手）有人看見啦。\n\n（春嬌抬頭。停一拍。）\n\n妞妞：阿姨每天早上，都在巷口掃落葉。\n\n小寶：阿姨還幫我撿過滾到水溝邊的球！\n\n春嬌：（眼眶紅了，搖頭笑）這種小事……你們都記得。\n\n阿嬤：妳對大家好，大家攏記佇心肝內。（停一拍，一字一字說）今仔日，換阮來。〔譯：大家都記在心裡。今天，換我們來〕\n\n（停約 2 秒。春嬌看著一家人，猶豫一下，把手上的清單遞給麗玲。麗玲接過來，捲起袖子。）\n\n**④ 分工**\n\n麗玲：好！春嬌姐，妳的手今天只准做一件事——動嘴巴，負責教。長輩的年菜，我跟媽來煮。\n\n阿誠：那我呢？\n\n麗玲：六個便當，送六戶，你負責。\n\n阿誠：（拍拍大腿）好啦，蘿蔔腿就是要跑腿的。\n\n小寶：那我們呢？\n\n阿嬤：你們兩個，一戶寫一張「春」字，送便當順便貼。\n\n妞妞：我寫！\n\n小寶：那我……負責貼！\n\n（麗玲、阿嬤打開蒸籠，把蘿蔔糕分進六個便當盒；阿誠把裝好的盒子疊起來。春嬌坐著用左手指點：比「切小塊」，又搖手示意「這盒不要淋醬」，麗玲點頭照做。）\n\n**⑤ 溝通：跟先生說實話**\n\n麗玲：（手沒停）春嬌姐，姐夫知道妳手受傷嗎？\n\n春嬌：（搖頭）他那麼累，我不想讓他煩。\n\n阿嬤：毋通按呢。夫妻是一家人，妳不講，他只能用猜的。〔譯：不可以這樣〕\n\n麗玲：傳個訊息給他吧，照實講就好。\n\n（春嬌拿起手機，用左手慢慢打字，小寶、妞妞湊到她肩膀兩邊看。打到一半，她停下來看阿嬤；阿嬤點點頭。她深吸一口氣，按下送出，把手機放在膝蓋上。）\n\n**⑥ 餘慶：先生的回覆**\n\n【手機「叮」】（春嬌看手機，愣住。）\n\n麗玲：回了？\n\n春嬌：（唸出來）「老婆，妳手受傷怎麼沒跟我說？今晚回去，我們一起想辦法。媽那邊我來說。」\n\n（春嬌把手機按在胸口，笑出來，眼眶又紅了。麗玲輕拍她的肩。）\n\n（阿嬤看著她，慢慢說。門神不動。）\n\n阿嬤：古早人講「積善之家，必有餘慶」。妳平常種的善，今仔日，攏轉來矣。〔譯：妳平常種的善，今天，都回來了〕\n\n【留白約 3 秒：不接台詞、不加音效，全體靜止看著春嬌。】\n\n**⑦ 傳承**\n\n春嬌：（站起來，用左手拍拍麗玲的手臂）明年換我手好了，我去你們家幫忙做蘿蔔糕。\n\n阿嬤：好啊。阿嬤這个配方，是阮阿母教的——今年教恁，以後換恁教囡仔。〔譯：阿嬤這個配方，是我媽媽教的——今年教你們，以後換你們教孩子〕\n\n阿誠：那我也要學，我不想每年只當蘿蔔腿。\n\n阿嬤：好！明年開始，蘿蔔糕你們做，阿嬤負責——\n\n小寶、妞妞：（搶答）吃邊邊！\n\n小寶：切得跟蒸籠一樣大那種！\n\n阿嬤：（大笑）著！切得跟蒸籠一樣大！〔譯：對！〕【笑點④：邊邊呼應，停約 2 秒】\n\n#### 3-3　過年囉（約 0:30）\n\n（阿嬤從口袋拿出一個金色的小羊吊飾——和壓軸時發給觀眾的是同一款——掛在春嬌的門牌立架上。）\n\n阿嬤：來，這隻金羊掛佇妳門口，結一个善緣——羊年行大運！〔譯：這隻金羊掛在妳家門口，結個善緣〕\n\n春嬌：（摸摸金羊，笑）多謝壇主！\n\n（妞妞拿出紅紙「春」字交給小寶，小寶踮腳貼在門牌立架上。阿誠抱起疊好的六個便當盒，麗玲提起提袋，春嬌站到阿嬤身邊。全體面向觀眾。）\n\n阿嬤：菜分好了，便當裝好了，春字也貼好了——（高舉雙手）大家！過年囉！\n\n全體（阿嬤、阿誠、麗玲、小寶、妞妞、春嬌）：過年囉！\n\n【鏘鏘！鑼鼓直接切入 M5 歡樂門神曲。】\n\n### 第四階段｜歡樂門神壓軸（2:30，台上部分）\n\n> **會議討論重點｜第四階段：歡樂門神壓軸與發放禮品**\n> - 出場人員：全體大門神與小門神（共約 10 位）全數齊聚舞台。\n> - 表演內容：帶來約 2~3 分鐘頓挫感強烈、歡樂熱鬧的總決選舞蹈，進行穿梭隊形變換與搭橋走位。\n> - 走下舞台發禮：舞蹈結束後，全體門神與演員一同走入觀眾席，向現場前賢發放「3D列印金羊吊飾」與「名片型錢母卡」。\n\n【暫按 10 位門神＋2 位小門神設計，總人數待確認。隊形以「兩人一組」為單位，少一組仍可執行（見附錄 G）。每個隊形轉換都落在 M5 的頓挫點上，細部舞步由江敏娟編排。門神分組代號見附錄 D。】\n\n- 0:00–0:10｜話劇演員退到舞台後方兩側：阿誠把便當盒疊在蒸籠上交給右側翼後台人員【道具交接】；春嬌把矮凳搬到右後。六人分站左後、右後，跟拍子拍手，不跳大動作。主門神第 1 組移到中央前方。\n- 0:10–0:35｜入場亮相（每個頓挫點進一組）：頓挫點 1 第 2 組自左側上、頓挫點 2 第 3 組自右側上、頓挫點 3 第 4 組自右側上、頓挫點 4 第 5 組自左側上。每組進場落在頓挫點時抱拳亮相一次。小門神組從觀眾席走道快步上台（從哪個台階依場地確認；無台階時改從側翼上），0:35 前到中央最前方。\n- 0:35–0:55｜隊形一「雙列開合」：門神排成左右兩直列各 5 人面向中央，小門神在前。頓挫點就「開」（向外跨一步、展披風），下一個頓挫點「合」（向內收、抱拳），做一次。\n- 0:55–1:15｜隊形二「交錯穿梭」：左右兩列以右肩對右肩交錯穿過、轉身，再穿回原位；小門神在前線左右交換位置。行進步法不要太快，先確認披風不勾到。\n- 1:15–1:35｜隊形三「搭橋」：各組兩人面對面，雙手高舉相交搭成拱橋，5 道拱橋由後往前排成一列；小門神從後方高舉雙手穿過拱橋走到前方，經過每道橋時該組做一個「賜福」手勢。\n- 1:35–1:45｜大亮相：V 字隊形，第 1 組在尖端中央，其餘各組往後左右展開，小門神在最前方（站或蹲，由編舞視實際狀況決定）。【定格：全體亮相】\n- 1:45–2:05｜祝福：M5 降成輕鼓底。話劇六人從後方走到門神 V 字前方排成一橫排。（大掃除群演是否加入此橫排，依舞台大小決定，尚未確認。）\n\n阿嬤：祝前人、各位點傳師及前賢大家——\n\n全體話劇演員：修道精進，步步高升，甜甜蜜蜜，羊年行大運！\n\n（「行大運」最後一字落下時，全體門神抱拳。全體一起向觀眾一鞠躬。）【鏘！M5 接 loop 版】\n\n- 2:05–2:30｜門神以組為單位從台前下到走道口，從發送組手上接過提籃，進入各自分區（見附錄 C）。門神遞出的金羊吊飾，就是阿嬤在 3-3 掛在春嬌門口的同一款，讓舞台上的善緣延伸到全場。話劇演員向觀眾揮手【下】。**2:30（全場約 13:55）＝台上節目完成。**\n- 2:30 起｜全場發放。M5 loop 持續，視聽在發送組回報「各區發完」後淡出。主持是否在發放期間接下一個節目，需與總召確認。\n\n## 第二部分｜附錄（籌備團隊用）\n\n### 附錄 A｜流程時間表、候場與音樂\n\n估算台上節目約 **13 分 55 秒**，目標 13 分 40 秒～14 分 10 秒。話劇時間是實算的：對白共約 1,030 字、73 句，以業餘演員每秒約 3.5 字、每句接話約 0.8 秒估計，純對白約 5 分 50 秒；再加上定格、走位、道具動作、留白與笑聲約 2 分 35 秒，話劇約 8 分 25 秒。其中 3-2 春嬌家對白約 3 分鐘，動作、暫停鍵與留白約 1 分 30 秒，合計約 4 分 30 秒。第一次對讀請實際計時；仍超時就用附錄 G 的「再縮減備案」。\n\n| 累計時間 | 段落 | 長度 | 在台上／出場 | 音樂與音效（視聽：吳國禎） | 轉場與備註 |\n| --- | --- | --- | --- | --- | --- |\n| 00:00–01:00 | 一、威武門神登場 | 1:00 | 主門神第 1 組 | M1 門神威武版（新春揚琴）約 60 秒 | 最後一拍兩人如門板「開門」，迎阿嬤上場；第二階段前奏退到左右前緣「守護位」定格 |\n| 01:00–03:00 | 二、歡樂大掃除 | 2:00 | 阿嬤一家 5 人、大掃除群演（待確認）、春嬌（尾段，可刪）；場下：小門神 | M2 大掃除恰恰融合版，需剪成約 2:00（第 2 版 Demo 為 2:44） | 尾奏 20 秒換景：搬桌、凳、蒸籠到左區 |\n| 03:00–06:00 | 三-1 灶腳 | 3:00 | 阿嬤一家 5 人；主門神在守護位 | M3 灶腳襯底（可選，低音量）；鑼×2（暫停鍵①）＋揚琴短句 5 秒 | 暫停鍵①後主門神離開守護位，跟全家出門 |\n| 06:00–06:25 | 三 轉場：巷子 | 0:25 | 一家 5 人＋主門神；春嬌自右側上場就位 | M4 過場短句約 15 秒 | 不換景、不黑場 |\n| 06:25–10:55 | 三-2 春嬌家 | 4:30 | 一家 5 人、春嬌、主門神 | 敲門聲（可現場敲）；鑼×2（暫停鍵②）＋揚琴單音；手機「叮」 | 全劇情感重心；「換阮來」後停約 2 秒、「積善之家」後留白約 3 秒 |\n| 10:55–11:25 | 三-3 過年囉 | 0:30 | 同上 | 齊喊「過年囉！」後鑼鼓直接切 M5 | 話劇演員退到舞台後方兩側 |\n| 11:25–13:55 | 四、歡樂門神壓軸 | 2:30 | 門神 10 位＋小門神 2 位（暫定）、話劇演員、（可加）大掃除群演 | M5 歡樂門神曲（鑼鼓、頓挫點明確）約 2:05，接 loop 版 | **13:55＝台上節目完成** |\n| 13:55– | 全場發放禮品 | 視人數而定 | 門神、發送組 3 位 | M5 loop 持續，由發送組回報後淡出 | 不保證 3 分鐘內發完，見附錄 C |\n\n#### 候場與催場時間點\n\n| 誰 | 最晚就位時間 | 就位地點 | 備註 |\n| --- | --- | --- | --- |\n| 主門神第 1 組 | 開演前 | 左、右側翼各一位 | 00:00 起一直在台上約 14 分鐘，守護位可用較放鬆 每組門神沿自己的走道單向前進、回頭時走同一側，不與其他組對撞。走道太窄時一條走道只進一組。披風較長者發放時可先收到肩後。\n- **時間估算**：全場發完時間≈觀眾數 ÷（進入走道的門神人數 × 每人每分鐘可遞約 10～15 袋）＋走位時間。這是排練時要實測的假設值，**不保證 3 分鐘內發完**。\n- **其他派人力**：大掃除群演演完後協助補貨或發放，屬建議分配，尚未確認。幕後職司者不自動納入。\n\n### 附錄 D｜角色與演員對照（完整）\n\n有台詞的角色共 6 位，其中 2 位（爸爸、孫子）演員待確認；門神全部無聲。「孫子」「孫女」是劇中角色，不代表演員實際年齡，劇本也沒有安排需要特別體能的動作。\n\n| 角色 | 演員 | 人物關係／功能 | 台詞 | 出場階段 | 確認狀態 |\n| --- | --- | --- | --- | --- | --- |\n| 陳老壇主（阿嬤） | 李冠德（反串） | 一家之主、巷子裡的老壇主；做蘿蔔糕結善緣，帶全家去家訪 | 有（主要） | 一（開門時現身）、二、三、四 | 文件已載 |\n| 阿誠（爸爸） | 【待確認】 | 阿嬤的兒子，憨厚、負責出力跑腿 | 有 | 二、三、四 | 角色文件已載；演員待確認 |\n| 麗玲（媽媽） | 蔡梅烽（依原表括註） | 阿嬤的媳婦，開朗、會安排分工 | 有 | 二、三、四 | 依原表括註；建議會議再確認一次 |\n| 小寶（孫子） | 【待確認】 | 阿嬤的孫子，愛吃，負責「吹蘿蔔糕」「邊邊」笑點 | 有（短句） | 二、三、四 | 角色文件已載；演員待確認 |\n| 妞妞（孫女） | 蘇湘澄 | 阿嬤的孫女，細心、愛幫忙 | 有（短句） | 二、三、四 | 文件已載 |\n| 春嬌（受家訪者） | 張素環 | 巷口鄰居道親，積德行善家庭的代表 | 有（主要） | 二（可刪）、三、四 | 演員文件已載；角色名與背景為編劇新增 |\n| 春嬌的先生 | 不上台 | 只以 LINE 訊息出現，由春嬌唸出；第三版改成一般丈夫的口氣，不是完美救星 | 無 | — | 編劇新增 |\n| 明叔、阿桃姨 | 不上台 | 春嬌每天送便當的鄰居長輩，只在台詞中提到 | 無 | — | 編劇新增（改自原稿） |\n| 主門神甲（阿嬤家門神／左） | 黃家倍 | 開場主門神；劇中守護阿嬤家、跟著家訪 | 無聲 | 一、二、三、四 | 門神名單文件已載；主門神身分為編排假設，待確認 |\n| 主門神乙（阿嬤家門神／右） | 彭永才 | 同上 | 無聲 | 一、二、三、四 | 同上 |\n| 門神群 | 陳志杰、蘇意舜、劉慶明、劉治中、戴瑋德、劉冠麟、周晴宣、田濙菁 | 壓軸歡樂門神舞、走道祝福 | 無聲 | 四 | 名單文件已載；門神總數待確認 |\n| 小門神 | 蔡秉宏、陳塏侖 | 大掃除場下巡視；壓軸從走道上台 | 無聲 | 二、四 | 文件已載；滑板車使用待確認 |\n| 大掃除群演（多戶人家） | 【待確認】；建議邀請待分配的姜莉莘、廖德玲、戴鏡智、陳氏闔家 5 位 | 手持掃帚、拖把、抹布的巷子鄰居 | 無 | 二（可加四謝幕） | 建議分配，尚未確認 |\n| — | 周義順 | 職司表「爸爸、媽媽(蔡梅烽)、孫子：周義順」一行的列名者 | — | — | 該行職責待確認；本版未指派任何角色 |\n\n**門神分組代號（編排假設，依職司表同行排列）**：第 1 組黃家倍、彭永才｜第 2 組陳志杰、蘇意舜｜第 3 組劉慶明、劉治中｜第 4 組戴瑋德、劉冠麟｜第 5 組周晴宣、田濙菁｜小門神組蔡秉宏、陳塏侖。\n\n### 附錄 E｜人員完整性與兼任檢查\n\n職司表共 32 個具名列名、29 位不重複人員，外加「陳氏闔家 5 位」；下表每一位都有紀錄。重複列名的 3 位是張素環、周晴宣（兼任兩職）與劉慶明（門神與待分配重複，算一人）。有紀錄不代表要上台。\n\n| 姓名 | 職司表列名 | 本版安排 | 類別 | 演出中時段（累計） | 兼任／衝突備註 |\n| --- | --- | --- | --- | --- | --- |\n| 陳錦秀 | 總召 | 全場統籌、待確認事項拍板 | 幕後職司 | 全場 | — |\n| 張素環 | 戲劇組；演員（受家訪者） | 飾春嬌 | 已安排演出＋幕後職司 | 02:40–03:00（可刪）、06:00–13:55 | 上台期間不能做戲劇組現場工作；代理人待指定（建議同組劉欣柔，尚未確認） |\n| 劉欣柔 | 戲劇組 | 未安排上台；建議負責提詞、催場、道具檢查 | 幕後職司（工作內容為建議） | 全場 | — |\n| 李鉢卿 | AI 音樂 Demo／後製 | 製作 M1–M5 與音效 。理由：演員不足、話劇只有約 9 分鐘、一戶家訪才聚焦。原稿「老梅子」「地質層」等笑點隨段落一併刪除。\n6. **積善之家必有餘慶的呈現**：春嬌平常照顧巷子，所以她有困難時，阿嬤一家主動上門相挺——「餘慶」是人情回流、大家來幫忙，不是錢財、升遷或神蹟。\n7. **舞台分區（以觀眾視角為準）**：左區＝阿嬤家灶腳；右區＝春嬌家；中央＝巷子兼舞蹈區。家訪靠演員走位和少量道具完成，不換景、不黑場。\n8. **大掃除兼換景**：大掃除最後一段，由家庭成員把桌子、蒸籠搬到左區，直接接話劇。\n9. **春嬌在大掃除露面**：張素環以「掃巷口的鄰居」身分出現在大掃除尾段，先讓觀眾認識春嬌（可刪，不影響時間）。\n10. **開門與金羊**：開場最後一拍，兩位主門神像兩扇門板一樣「開門」，阿嬤從門中間出場，直接接大掃除。3-3 阿嬤把一個金羊吊飾掛在春嬌門口，和壓軸發放的是同一款，讓禮品接上「結善緣」的劇情。\n11. **第二版取消「春嬌家門神」段落**：第 4 組戴瑋德、劉冠麟改為只在壓軸出場。\n12. **時光與傳承（第三版）**：阿嬤的蘿蔔糕配方來自她的母親，今年教給春嬌與全家，以後再教下一代。「時光廚房」指的是這份手藝與善心一代傳一代，不是時空穿越。\n\n### 附錄 G｜會議需求對照、刪減紀錄與待確認事項\n\n會議紀錄的四階段流程、音樂決議與道具規劃都已落實到劇本；第三版台上約 13 分 55 秒，若排練仍超時，還有約 1 分鐘的再縮減備案。\n\n#### 會議需求落實位置\n\n| 會議需求 | 落實位置 |\n| --- | --- |\n| 四階段流程，整體 15～18 分鐘 | 附錄 A 時間表，第三版估算 13:55 |\n| 兩位主門神配新春揚琴威武曲登場，舞畢兩側定格守護 | 第一階段；守護位延續到話劇 |\n| 大掃除用恰恰節奏、持掃帚拖把抹布、容易編舞 | 第二階段：恰恰基本步＋兩組輪流做歌詞動作 |\n| 小門神騎滑板車場下巡視 | 第二階段，附不用滑板車的替代走位 |\n| 話劇濃縮為家訪一戶積德行善家庭 | 3-1 定動機、3-2 家訪春嬌 |\n| 門神無聲顯靈與定格，彰顯「積善之家必有餘慶」 | 暫停鍵①②、「被吹」反應；阿嬤在 3-2 ⑥ 說出這句話 |\n| 壓軸歡樂舞曲：大動作、穿梭交錯、搭橋變陣、定格亮相 | 第四階段隊形一至三與大亮相 |\n| 門神走走道發放金羊吊飾與錢母卡 | 第四階段 2:05 起，與發送組分區分工；3-3 阿嬤先把同款金羊掛在春嬌門口，讓發放接上劇情 |\n| 阿嬤花衫、白假髮、老妝、三八痣、講台語 | 阿嬤對白穿插台語短句；造型只是造型，全劇沒有拿外貌或性別開玩笑 |\n| 掃把拖把買新的輕的，彩排包袋或借棍操棒 | 附錄 B 道具表 |\n\n#### 第二版、第三版已刪除內容（時間有餘可加回）\n\n| 刪除內容 | 省下時間 | 說明 |\n| --- | --- | --- |\n| 可選段 A：兩家門神見禮（原暫停鍵②） | 約 20 秒 | 第 4 組改為只在壓軸出場 |\n| 轉場「要叫人喔／先預約」4 句 | 約 15 秒 | 改為阿嬤摸口袋確認金羊，順便預告 3-3 |\n| 3-3「貼倒了／春到」3 句 | 約 12 秒 | 小寶直接貼好春字 |\n| 3-2「吹蘿蔔糕」呼應段 | 約 20 秒 | 保留「邊邊跟蒸籠一樣大」作為後段呼應 |\n| 3-2 阿誠「去年颱風……」 | 約 10 秒 | — |\n| 3-2 貼圖 3 句 | 約 10 秒 | — |\n| 3-2 麗玲「十二道？」與春嬌「年年有餘」 | 約 6 秒 | — |\n| 3-2 阿嬤「十二道菜，兩家合起來辦」 | 約 8 秒 | 改為分工只處理長輩便當，年夜飯交給春嬌先生，劇情更清楚 |\n| 3-1 小寶「可是它很香嘛」、阿誠「她先生跑貨運」、麗玲名單中「隔壁陳媽媽」 | 約 12 秒 | 先生加班改由春嬌自己在 3-2 說出 |\n| 暫停鍵①揚琴短句 10 秒改 5 秒 | 約 5 秒 | — |\n| 壓軸：隊形四「圍圈開花」、雙列開合改做一次、入場縮短 | 約 30 秒 | M5 需同步剪到約 2:05 |\n| （第三版）3-2 阿嬤「人咧做，天咧看——阮嘛攏有咧看」「小事做久，就是大事」 | 約 8 秒 | 暫停鍵②門神鞠躬已表達「天在看」；讓「有人看見啦」「換阮來」更集中 |\n| （第三版）3-2 阿嬤對婆婆十二道菜的說理（「人齊上重要」），春嬌「可是婆婆那邊」 | 約 15 秒 | 改由先生回覆「媽那邊我來說」帶過 |\n| （第三版）3-2 阿誠「六個？過年還要加菜？」、小寶數一到六、春嬌「教什麼？」與「明叔牙齒不好…」 | 約 20 秒 | 改成小寶比「六」、春嬌用手勢教 |\n| （第三版）3-2 阿誠「姐夫有擔當喔」、春嬌「幫我謝謝壇主一家」、阿嬤「謝啥物」 | 約 10 秒 | 先生回覆後直接接阿嬤「積善之家」 |\n\n#### 再縮減備案（排練後仍超時才用）\n\n| 順序 | 刪什麼 | 省下時間 | 刪了會少什麼 |\n| --- | --- | --- | --- |\n| 1 | 轉場「等咧」與門神撞背小笑點 | 約 8 秒 | 少一個門神小笑點 |\n| 2 | 3-2 ⑦ 阿誠「那我也要學」 | 約 5 秒 | 少一次「蘿蔔腿」呼應；阿嬤「換恁教囡仔」仍保留傳承 |\n| 3 | 3-2 ④ 小寶、妞妞「我寫／我負責貼」 | 約 5 秒 | 孩子少兩句，春字仍由阿嬤分派 |\n| 4 | 壓軸隊形二「交錯穿梭」 | 約 20 秒 | 會議提到的「穿梭交錯」需併入搭橋段 |\n| 5 | 大掃除剪到 1:45 | 約 15 秒 | 低於會議寫的 2～3 分鐘，需會議同意 |\n\n**不可刪的主線**：春嬌「好像都沒有人看見」＋暫停鍵②＋阿嬤「有人看見啦」「今仔日，換阮來」、④ 分工、⑤ 溝通、⑥ 先生回覆與「積善之家」一句、⑦ 阿嬤「以後換恁教囡仔」。這些刪了，家訪就只剩送東西。\n\n#### 門神若改成 10 人的隊形調整\n\n不在此決定刪誰，只說明隊形怎麼變。隊形以「兩人一組」設計，少一組時：入場少一個頓挫點（該拍改給小門神亮相）；雙列開合改為每列 4 人；搭橋改為 4 道拱橋；V 字改為尖端 1 組、後方左右各 1～2 組。若減少後出現單數人，孤單的一位可站 V 字尖端或與小門神同組。\n\n#### 待確認事項（會影響演員、劇情、時間或現場執行）\n\n- [ ] 門神總數是 10 還是 12 位？開場主門神是黃家倍、彭永才，還是文字版紀錄舉例的黃家倍、劉治中？蘇意舜能否參加？\n- [ ] 爸爸（阿誠）、孫子（小寶）由誰演？周義順在該行的職責是什麼？媽媽由蔡梅烽飾演是否確定？\n- [ ] 第三版全場約 14 分鐘、話劇約 8 分 25 秒，明顯低於會議寫的 12～15 分鐘，需在第三次會議確認採用。（9/26 另有「全場約 18 分鐘」的流程構想，兩者需擇一定案。）\n- [ ] 主門神是否全程留在兩側守護（docx），還是大掃除前退場（文字版）？\n- [ ] 大掃除群演名單：待分配的姜莉莘、廖德玲、戴鏡智與陳氏闔家 5 位是否參加？陳氏闔家的姓名與是否與其他名單重疊。\n- [ ] 滑板車是電動還是人力？場地走道寬度與台階位置是否允許？台下巡視只有小門神，還是全體門神？\n- [ ] 發放時間點定在壓軸舞後是否可行？發放期間主持是否接下一個節目？觀眾人數與座位分區。\n- [ ] 後台道具交接、門牌立架擺放、門神著裝協助、滑板車接手由誰負責？張素環、周晴宣的現場職務代理人是誰？\n- [ ] 音樂長度：M2 剪到約 2:00、M5 約 2:05 加 loop 版，以及鑼聲用音效檔還是現場敲。\n\n#### 排練建議\n\n1. **第一次對讀就計時**：只讀話劇，每個小節（3-1、轉場、3-2 ①～⑦、3-3）分別計時；3-2 請特別量「換阮來」後 2 秒停頓與「積善之家」後 3 秒留白，不要被搶拍，與附錄 A 估算比對，超時就照「再縮減備案」順序刪。\n2. **暫停鍵單獨練**：視聽敲鑼、演員定格、門神動、再敲鑼恢復，兩個暫停鍵各練 3 次。主門神只需額外出席話劇轉場與暫停鍵的排練，其他門神只練壓軸。\n3. **貼地標**：守護位、左區桌位、右區門牌立架、壓軸 V 字尖端。\n4. **大掃除以「練 5 次能上手」為目標**：先教恰恰基本步，再加兩個分組動作，其他交給江敏娟在排練時決定。\n\n### 第二版 → 第三版主要修改對照\n\n只列實際有改的地方；沒列的段落與第二版相同。\n\n| 位置 | 第二版 | 第三版 | 理由 |\n| --- | --- | --- | --- |\n| 全場長度 | 約 14:50 | 約 13:55 | 留約 1 分鐘給實際走位、道具與笑聲 |\n| 第三階段 | 約 9:20 | 約 8:25 | 只精簡 3-2，其他小節不動 |\n| 3-2 春嬌家 | 約 5:25，51 句、約 810 字 | 約 4:30，38 句、約 520 字 | 能用動作演的不說，觀眾能懂的不再解釋 |\n| 3-2 ① 進門 | 春嬌「壇主？麗玲？」「家裡很亂」、阿嬤「來送蘿蔔糕啦」 | 合併成較短的招呼 | 減少寒暄，快點進入手傷 |\n| 3-2 ② 便當 | 小寶數「一到六」、阿誠「六個？過年還要加菜？」 | 小寶用手指點、對阿誠比「六」，阿誠看看春嬌的手 | 改用動作表演 |\n| 3-2 ② 困難 | 春嬌三句分開說 | 併成一段 | 資訊不變，節奏較緊 |\n| 暫停鍵② | 主門神轉身、抱拳、深深一鞠躬 | 相同，另註明不加表情、動作、笑點 | 守住情感段的莊重 |\n| 3-2 ③ 有人看見 | 阿嬤另有「人咧做，天咧看」「小事做久，就是大事」 | 刪去兩句；「今仔日，換阮來」前停一拍、後停約 2 秒 | 讓「有人看見啦」和「換阮來」成為高點 |\n| 3-2 ③→④ 接受幫助 | 阿嬤指派「麗玲，妳上會安排」 | 春嬌猶豫一下，自己把清單遞給麗玲 | 用動作呈現春嬌「願意接受幫助」 |\n| 3-2 ④ 分工 | 春嬌「教什麼？」、麗玲解釋、「明叔牙齒不好，阿桃姨不能吃太鹹」 | 刪去台詞，改成春嬌用手勢教「切小塊、不要淋醬」 | 能用動作演的不說 |\n| 3-2 ⑤ 溝通 | 阿嬤「猜錯了，兩個人都委屈」，春嬌「可是婆婆那邊」，阿嬤說明婆婆要的是人齊 | 只留「夫妻是一家人，妳不講，他只能用猜的」，春嬌傳訊前看阿嬤、阿嬤點頭 | 減少說理，婆婆的事交給先生回覆 |\n| 3-2 ⑥ 先生回覆 | 「對不起…跟老闆說好了，除夕中午就回家。媽那邊我去講，年夜飯我來煮，妳負責坐著。」＋「幫我謝謝壇主一家」 | 「老婆，妳手受傷怎麼沒跟我說？今晚回去，我們一起想辦法。媽那邊我來說。」 | 口氣自然，先生不是完美救星；重點是說出困難、一起分擔 |\n| 3-2 ⑥ 反應 | 阿誠「姐夫有擔當喔」、阿嬤「謝啥物」 | 刪去；春嬌把手機按在胸口，麗玲拍肩 | 情緒不被打斷 |\n| 3-2 ⑥ 積善之家 | 「餘慶毋是天頂落落來的紅包，是妳平常種的善，今仔日變做大家的手，來幫妳。」 | 「妳平常種的善，今仔日，攏轉來矣。」後面留白約 3 秒 | 一句說完，留空間給觀眾 |\n| 3-2 ⑦ 傳承 | 阿嬤「好啊，阿嬤的配方，教妳。」 | 阿嬤「阿嬤這个配方，是阮阿母教的——今年教恁，以後換恁教囡仔。」 | 把「時光」落在一代傳一代 |\n| 3-2 ⑦ 阿誠 | 「媽，那配方我也要學，我不想每年只負責當蘿蔔腿。」 | 「那我也要學，我不想每年只當蘿蔔腿。」 | 縮短，保留蘿蔔腿呼應 |\n| 附錄 A、C、E | 以 14:50 推算的時間點 | 3-3 起的時間點全部提前 55 秒（例：壓軸 11:25 起、交提籃 13:30、第 2～5 組 10:35 候場、催場 08:40） | 配合新總長 |\n| 附錄 B | — | 道具連續性加上「清單：春嬌 → 麗玲」 | 新增的遞清單動作 |\n| 附錄 F、G | 第二版數字與備案 | 更新總長、刪減紀錄、再縮減備案、不可刪主線、待確認事項 | 配合第三版 |\n\n資料來源：《老壇主的時光廚房》原劇本、《2027年教定區新春節目籌劃｜第２次會議紀錄》、《2027 新春節目職司分工》；參考：專案內《第二次會議紀錄_0923》文字版。\n"}</script>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function inline(t,dlg){
  t=esc(t);
  t=t.replace(/(?:M|Ｍ)([1-5１-５])/g,function(label,n){
    var full='１２３４５'.indexOf(n),i=full>=0?full+1:Number(n);
    return '<button class="music-link" type="button" data-music="'+i+'" title="在本頁播放 M'+i+' 音樂">'+label+'</button>';

  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/【([^】]*)】/g,'<span class="cue">$1</span>');
  t=t.replace(/〔譯：([^〕]*)〕/g,'<span class="tr">譯｜$1</span>');

}

function splitMeta(title){var m=title.match(/（([^（）]*\d[^（）]*)）\s*$/);return m?[title.slice(0,m.index).trim(),m[1]]:[title,''];}
function summary(title){var sm=splitMeta(title);return '<summary><span class="st">'+inline(sm[0])+'</span>'+(sm[1]?'<span class="meta">'+esc(sm[1])+'</span>':'')+'<span class="chev" aria-hidden="true"></span></summary>';}
function parseDlg(ln){

function changed(i){return ORIG.has(lines[i])?'':' changed';}
function src(i,prefix,text){return '<span class="src" contenteditable="'+(PT?'plaintext-only':'true')+'" spellcheck="false" data-i="'+i+'" data-p="'+esc(prefix)+'">'+esc(text)+'</span>';}
function tools(i){return '<span class="edt"><button class="eb" type="button" data-add="'+i+'" title="在下面加一行" aria-label="在下面加一行">＋</button><button class="eb" type="button" data-del="'+i+'" title="刪除這一行" aria-label="刪除這一行">刪</button></span>';}
function wrapEdit(i,inner){return '<span class="edrow"><span class="grow">'+inner+'</span>'+tools(i)+'</span>';}

function renderBody(){
  var out=[],l3=false,l4=false,list=null,part=0,sid=0,intro=[],started=false;
  function closeList(){if(list){out.push(list==='ol'?'</ol>':'</ul>');list=null;}}
  function closeL4(){closeList();if(l4){out.push('</div></details>');l4=false;}}
  function closeL3(){closeL4();if(l3){out.push('</div></details>');l3=false;}}
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].replace(/\s+$/,''),m;
    if(ln.indexOf('# ')===0)continue;
    if(!started&&ln.indexOf('## ')!==0){if(ln.trim()&&ln.indexOf('版本：')!==0)intro.push(ln);continue;}
    if(ln.indexOf('## ')===0){
      started=true;closeL3();if(part)out.push('</section>');part++;
      var name=ln.slice(3),k=name.indexOf('｜');
      out.push('<section class="part '+(part===1?'script':'appx')+'" id="part'+part+'"><h2><span class="plabel">'+esc(k>=0?name.slice(0,k):name)+'</span>'+esc(k>=0?name.slice(k+1):'')+'</h2>');
      continue;
    }
    if(ln.indexOf('### ')===0){closeL3();sid++;out.push('<details class="l3" id="s'+sid+'">'+summary(ln.slice(4))+'<div class="body">');l3=true;continue;}
    if(ln.indexOf('#### ')===0){closeL4();sid++;out.push('<details class="l4" id="s'+sid+'">'+summary(ln.slice(5))+'<div class="body">');l4=true;continue;}
    if(!ln.trim())continue;
    if(ln.indexOf('> ')===0){
      closeList();var qh='<div class="focus">',inUl=false;
      while(i<lines.length&&lines[i].indexOf('> ')===0){
        var qt=lines[i].slice(2),qm=qt.match(/^- (.*)$/);
        if(editing){qh+='<div class="fline'+changed(i)+'">'+wrapEdit(i,src(i,qm?'> - ':'> ',qm?qm[1]:qt))+'</div>';}
        else if(qm){if(!inUl){qh+='<ul>';inUl=true;}qh+='<li>'+inline(qm[1])+'</li>';}
        else{if(inUl){qh+='</ul>';inUl=false;}var qb=qt.match(/^\*\*(.+)\*\*$/);qh+=qb?'<div class="fhead">'+inline(qb[1])+'</div>':'<p>'+inline(qt)+'</p>';}
        i++;
      }
      i--;if(inUl)qh+='</ul>';out.push(qh+'</div>');continue;
    }
    if(ln.charAt(0)==='|'){
      closeList();var rows=[ln];
      while(i+1<lines.length&&lines[i+1].charAt(0)==='|'){rows.push(lines[++i]);}
      var cells=rows.map(function(r){return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim();});});
      var h='<div class="tbl"><table><thead><tr>'+cells[0].map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>';
      cells.slice(2).forEach(function(r){h+='<tr>'+r.map(function(c){return '<td>'+inline(c)+'</td>';}).join('')+'</tr>';});
      out.push(h+'</tbody></table></div>');continue;
    }
    if((m=ln.match(/^- \[ \] (.*)$/))){
      if(list!=='todo'){closeList();out.push('<ul class="todo">');list='todo';}
      out.push('<li class="'+changed(i)+'"><span class="box" aria-hidden="true"></span><span>'+(editing?wrapEdit(i,src(i,'- [ ] ',m[1])):inline(m[1]))+'</span></li>');continue;
    }
    if((m=ln.match(/^- (.*)$/))){
      if(list!=='ul'){closeList();out.push('<ul class="steps">');list='ul';}
      var tx=m[1],tm=tx.match(/^([0-9:–\-]+)｜(.*)$/);
      if(editing){out.push('<li class="line plain'+changed(i)+'" data-m="'+mentions(tx)+'">'+wrapEdit(i,src(i,'- ',tx))+'</li>');}
      else if(tm){out.push('<li class="line" data-m="'+mentions(tx)+'"><span class="tc">'+esc(tm[1])+'</span><span>'+inline(tm[2])+'</span></li>');}
      else{out.push('<li class="line plain" data-m="'+mentions(tx)+'">'+inline(tx)+'</li>');}
      continue;
    }
    if((m=ln.match(/^(\d+\. )(.*)$/))){
      if(list!=='ol'){closeList();out.push('<ol>');list='ol';}
      out.push('<li class="'+changed(i)+'">'+(editing?wrapEdit(i,src(i,m[1],m[2])):inline(m[2]))+'</li>');continue;
    }
    closeList();
    var d=parseDlg(ln);
    if(d){
      var who,shown,sub='';
      if(d.spk.indexOf('全體')===0){who='all';shown='全體';sub=d.spk.slice(2).replace(/^（|）$/g,'');}
      else{who=d.spk.split('、').filter(function(s){return ROLES.indexOf(s)>=0;}).join(' ');shown=d.spk;}
      var lng=(shown.length>3||sub)?' long':'';
      if(editing){
        var opts=SPEAKERS.slice();if(opts.indexOf(d.spk)<0)opts.unshift(d.spk);
        var sel='<select class="spsel" data-si="'+i+'" aria-label="說話的角色">'+opts.map(function(o){return '<option'+(o===d.spk?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'<option value="__act">→ 改成舞台動作</option></select>';
        out.push('<div class="line dlg'+lng+changed(i)+'" data-s="'+who+'"><span class="spk">'+sel+'</span>'+wrapEdit(i,src(i,d.spk+'：',d.text))+'</div>');
      }else{
        out.push('<div class="line dlg'+lng+'" data-s="'+who+'"><span class="spk">'+esc(shown)+(sub?'<span class="sub">'+esc(sub)+'</span>':'')+'</span><p>'+inline(d.text,true)+'</p></div>');
      }
      continue;
    }
    var cls='',c0=ln.charAt(0);
    if(c0==='（')cls='line act';else if(c0==='【')cls='line cueline';
    if(!editing&&/^\*\*[^*]+\*\*$/.test(ln)){out.push('<h5 class="beat">'+inline(ln.slice(2,-2))+'</h5>');continue;}
    var tag=cls?'p':'p';
    out.push('<'+tag+' class="'+cls+changed(i)+'"'+(cls?' data-m="'+mentions(ln)+'"':'')+'>'+(editing?wrapEdit(i,src(i,'',ln)):inline(ln))+'</'+tag+'>');
  }
  closeL3();if(part)out.push('</section>');
  return {intro:intro,body:out.join('\n')};
}

var MUSIC_NAMES={1:'M1｜門神威武版',2:'M2｜大掃除恰恰',3:'M3｜灶腳襯底',4:'M4｜過場短句',5:'M5｜歡樂門神壓軸'};
function playMusic(i){
  var dock=document.getElementById('musicDock'),audio=document.getElementById('musicAudio');
  if(audio.dataset.music!==String(i)){audio.src='music/M'+i+'.mp3';audio.dataset.music=String(i);}
  document.getElementById('musicTitle').textContent=MUSIC_NAMES[i]||('M'+i);
  dock.hidden=false;document.body.classList.add('has-music');
  [].slice.call(document.querySelectorAll('.music-link')).forEach(function(b){b.setAttribute('aria-current',String(+b.dataset.music===i));});
  var p=audio.play();if(p&&p.catch)p.catch(function(){});
}

function draw(){
  var r=renderBody();
  var openIds=pref.open||null;
  if(!root.firstChild){root.innerHTML=shell(r.intro.map(function(p){return '<p>'+inline(p)+'</p>';}).join(''));bindShell();}
  else{openIds=[].slice.call(document.querySelectorAll('#main details')).filter(function(d){return d.open;}).map(function(d){return d.id;});}
  document.body.classList.toggle('editing',editing);
  var main=document.getElementById('main');
  main.innerHTML=r.body;
  var all=[].slice.call(main.querySelectorAll('details'));
  if(openIds){all.forEach(function(d){d.open=openIds.indexOf(d.id)>=0;});}
  else{var f=main.querySelector('#part1 details.l3');if(f)f.open=true;}
  all.forEach(function(d){d.addEventListener('toggle',rememberOpen);});
  applyRole(pref.role||'',false);
  updateEditUI();
}
function rememberOpen(){pref.open=[].slice.call(document.querySelectorAll('#main details')).filter(function(d){return d.open;}).map(function(d){return d.id;});savePref();}

function applyRole(role,scroll){
  [].slice.call(document.querySelectorAll('.chip')).forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.role===role));});
  document.body.classList.toggle('has-role',!!role);
  var n=0,first=null;
  [].slice.call(document.querySelectorAll('.script .line')).forEach(function(el){
    var hit=false;
    if(role){
      if(el.classList.contains('dlg')){var s=(el.dataset.s||'').split(' ');hit=role!=='門神'&&(s.indexOf(role)>=0||s.indexOf('all')>=0);if(hit)n++;}
      else{hit=(el.dataset.m||'').split(' ').indexOf(role)>=0;if(hit&&role==='門神')n++;}
    }
    el.classList.toggle('hit',hit);el.classList.toggle('dim',!!role&&!hit);
    if(hit){var p=el.parentElement;while(p){if(p.tagName==='DETAILS')p.open=true;p=p.parentElement;}if(!first)first=el;}
  });
  var count=document.getElementById('count');
  if(!role)count.textContent='點角色，只亮出該角色的台詞與動作';
  else if(role==='門神')count.textContent='門神：共 '+n+' 處動作或定格';
  else count.textContent=role+'：共 '+n+' 句台詞（含齊聲）';
  pref.role=role;savePref();
  if(role){rememberOpen();if(scroll&&first)first.scrollIntoView({block:'center',behavior:'smooth'});}
}

function isDirty(){return lines.join('\n')!==original.join('\n');}
function stash(){try{if(isDirty())localStorage.setItem(SKEY,JSON.stringify({base:SRC.md,md:lines.join('\n')}));else localStorage.removeItem(SKEY);}catch(e){}}
function updateEditUI(){
  var eb=document.getElementById('editBtn');
  eb.hidden=!mode||readOnly||editing;
  document.getElementById('editmsg').firstChild.textContent=mode==='download'?'點虛線框直接改字，改完按「下載新版」，再上傳到 GitHub 取代原本的 index.html。':(mode==='firebase'?'點虛線框直接改字，改完按「儲存」，所有人的頁面會立刻更新。':'點虛線框直接改字，改完按「儲存」。');
  document.getElementById('editbar').hidden=!editing;
  var sb=document.getElementById('saveBtn');sb.disabled=!isDirty()||saving;
  sb.textContent=saving?'儲存中…':(mode==='download'?'下載新版 index.html':'儲存');
  var fbm=mode==='firebase';
  document.getElementById('histBtn').hidden=!fbm;
  document.getElementById('namef').hidden=!fbm;
  document.getElementById('foot').textContent=fbm?'角色篩選與展開狀態只存在你自己的瀏覽器。不用登入就能改台詞；按「儲存」後會即時同步給所有開著這一頁的人。每次儲存都會記下是誰、什麼時候改的，可以在「修改紀錄」載回任何一個版本。':'角色篩選與展開狀態只存在你自己的瀏覽器。台詞修改要按「儲存」或「下載新版」並更新網站後，其他人才會看到。';
}
function note(html){var n=document.getElementById('notice');if(!html){n.hidden=true;n.innerHTML='';return;}n.innerHTML=html;n.hidden=false;}

function lineAt(i){return lines[i];}
function bindShell(){
  document.getElementById('chips').addEventListener('click',function(e){var c=e.target.closest('.chip');if(c)applyRole(c.dataset.role,true);});
  document.getElementById('openAll').onclick=function(){[].slice.call(document.querySelectorAll('#main details')).forEach(function(d){d.open=true;});rememberOpen();};
  document.getElementById('closeAll').onclick=function(){[].slice.call(document.querySelectorAll('#main details')).forEach(function(d){d.open=false;});rememberOpen();};
  document.getElementById('editBtn').onclick=function(){needUser(function(){editing=true;draw();note('');});};
  document.getElementById('cancelBtn').onclick=function(){if(mode==='firebase'&&remoteMd!=null){original=remoteMd.split('\n');ORIG=new Set(original);}lines=original.slice();editing=false;stash();draw();note('');};
    document.getElementById('histBtn').onclick=openHist;
  var nm=document.getElementById('editorName');try{nm.value=localStorage.getItem(NKEY)||'';}catch(e){}
  nm.addEventListener('input',function(){try{localStorage.setItem(NKEY,nm.value.trim());}catch(e){}});
  document.getElementById('histClose').onclick=function(){document.getElementById('hist').hidden=true;};
  document.getElementById('histList').addEventListener('click',function(e){var b=e.target.closest('[data-h]');if(b)loadHist(+b.dataset.h);});
  document.getElementById('saveBtn').onclick=save;
  document.getElementById('musicClose').onclick=function(){var a=document.getElementById('musicAudio');a.pause();document.getElementById('musicDock').hidden=true;document.body.classList.remove('has-music');[].slice.call(document.querySelectorAll('.music-link')).forEach(function(b){b.removeAttribute('aria-current');});};
  var main=document.getElementById('main');
  main.addEventListener('click',function(e){var b=e.target.closest('.music-link');if(b){e.preventDefault();e.stopPropagation();playMusic(+b.dataset.music);}});
  main.addEventListener('input',function(e){
    var s=e.target.closest('.src');if(!s)return;
    var i=+s.dataset.i;lines[i]=s.dataset.p+s.textContent.replace(/\s*\n\s*/g,' ');
    var row=s.closest('.line,li,p');if(row)row.classList.toggle('changed',!ORIG.has(lines[i]));
    stash();updateEditUI();
  });
  main.addEventListener('keydown',function(e){if(e.isComposing||e.keyCode===229)return;if(e.key==='Enter'&&e.target.closest&&e.target.closest('.src')){e.preventDefault();e.target.blur();}});
  main.addEventListener('change',function(e){
    var sel=e.target.closest('.spsel');if(!sel)return;
    var i=+sel.dataset.si,d=parseDlg(lines[i]);if(!d)return;
    if(sel.value==='__act'){var t=d.text.trim();lines[i]=(t.charAt(0)==='（'?t:'（'+t+'）');}
    else lines[i]=sel.value+'：'+d.text;
    stash();draw();
  });
  main.addEventListener('click',function(e){
    var a=e.target.closest('[data-add]'),dl=e.target.closest('[data-del]');
    if(a){
      var i=+a.dataset.add,ln=lines[i],nl,d=parseDlg(ln),m;
      if((m=ln.match(/^(> - |> |- \[ \] |- |\d+\. )/)))nl=m[1];
      else if(d)nl=d.spk+'：';
      else nl='';
      if(m)lines.splice(i+1,0,nl);else lines.splice(i+1,0,'',nl);
      var target=m?i+1:i+2;stash();draw();
      var s=document.querySelector('.src[data-i="'+target+'"]');if(s)s.focus();
    }
    if(dl){var j=+dl.dataset.del;lines.splice(j,1);stash();draw();}
  });
}

function buildDoc(md){
  var data=JSON.stringify({version:SRC.version,edited:new Date().toLocaleString('zh-TW',{hour12:false}),md:md}).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="zh-Hant">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n<title>時光廚房排練本</title>\n'+FONTS+
    '<style id="page-style">'+document.getElementById('page-style').textContent+'</style>\n</head>\n<body>\n<div id="root"></div>\n'+
    '<script type="application/json" id="src">'+data+'<\/script>\n'+
    '<script id="app-js">'+document.getElementById('app-js').textContent+'<\/script>\n'+
    '<script type="module" id="fb-js">'+document.getElementById('fb-js').textContent+'<\/script>\n</body>\n</html>\n';
}
function cleanMd(){return lines.filter(function(l){var d=parseDlg(l);return !(d&&!d.text.trim())&&!/^(> - |> |- \[ \] |- |\d+\. )$/.test(l);}).join('\n');}
function download(){
  var html=buildDoc(cleanMd());
  try{var blob=new Blob([html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);}
  catch(e){note('這個瀏覽器無法下載檔案，請改用電腦版 Chrome 或 Edge 再試。');return;}
  note('已下載新的 index.html。請到 GitHub 儲存庫按「Add file → Upload files」上傳，取代原本的 index.html，約 1 分鐘後網頁就會更新。在那之前重新整理，本頁會提示你還原這次的修改。');
}
function save(){
  if(mode==='download'){if(isDirty())download();return;}
  if(mode==='firebase'){saveFB();return;}
  if(!artifactNs||!isDirty()||saving)return;
  var md=cleanMd();
  saving=true;updateEditUI();stash();
  artifactNs.publish(buildDoc(md)).then(function(){
    try{localStorage.removeItem(SKEY);}catch(e){}
    note('已儲存，頁面正在更新成新版本…');
  },function(err){
    saving=false;updateEditUI();
    var code=err&&err.code;
    if(code==='conflict')note('有人剛好也存了新版本，頁面會自動更新。你的修改已暫存，更新後可以按「還原」拿回來。');
    else if(code==='not_writer'||code==='not_granted'||code==='consent_required'||code==='capability_disabled'||code==='capability_removed'||code==='not_declared'){readOnly=true;editing=false;draw();note('你目前只有檢視權限，無法儲存修改。需要改台詞請請頁面擁有者開放編輯權限。');}
    else if(code==='rate_limited')note('剛剛存得太頻繁，請等一下再按一次「儲存」。');
    else if(code==='too_large')note('內容太大，無法儲存。請刪減後再試。');
    else note('儲存沒有成功，請稍後再按一次「儲存」。你的修改還在畫面上。');
  });
}

function offerRestore(){
  try{
    var d=JSON.parse(localStorage.getItem(SKEY)||'null');
    if(!d)return;
    if(d.md===SRC.md){localStorage.removeItem(SKEY);return;}
    note('上次有一份還沒存好的修改。<button class="btn" type="button" id="restoreBtn">還原</button><button class="tool" type="button" id="dropBtn">捨棄</button>');
    document.getElementById('restoreBtn').onclick=function(){lines=d.md.split('\n');editing=true;note('');draw();};
    document.getElementById('dropBtn').onclick=function(){try{localStorage.removeItem(SKEY);}catch(e){}note('');};
  }catch(e){}
}

/* ===== Firebase：即時同步、Google 登入、修改紀錄、衝突自動合併 ===== */
function hunks(a,b){
  var p=0,n=a.length,m=b.length;
  while(p<n&&p<m&&a[p]===b[p])p++;
  var ea=n,eb=m;while(ea>p&&eb>p&&a[ea-1]===b[eb-1]){ea--;eb--;}
  var A=a.slice(p,ea),B=b.slice(p,eb),N=A.length,M=B.length,W=M+1,L=new Uint32Array((N+1)*W);
  for(var i=N-1;i>=0;i--)for(var j=M-1;j>=0;j--)L[i*W+j]=A[i]===B[j]?L[(i+1)*W+j+1]+1:Math.max(L[(i+1)*W+j],L[i*W+j+1]);
  var out=[],cur=null;i=0;j=0;
  function open(){if(!cur)cur={s:p+i,e:p+i,lines:[]};}
  function close(){if(cur){out.push(cur);cur=null;}}
  while(i<N||j<M){
    if(i<N&&j<M&&A[i]===B[j]){close();i++;j++;}
    else if(j>=M||(i<N&&L[(i+1)*W+j]>=L[i*W+j+1])){open();i++;cur.e=p+i;}
    else{open();cur.lines.push(B[j]);j++;}
  }
  close();return out;
}
function applyIn(base,hs,S,E){var out=[],pos=S;hs.forEach(function(h){out=out.concat(base.slice(pos,h.s),h.lines);pos=h.e;});return out.concat(base.slice(pos,E));}
function merge3(base,mine,theirs){
  var bj=base.join('\n'),mj=mine.join('\n'),tj=theirs.join('\n');
  if(tj===bj||tj===mj)return {md:mj,merged:false,conflicts:0};
  if(mj===bj)return {md:tj,merged:true,conflicts:0};
  var all=hunks(base,mine).map(function(h){h.w=0;return h;}).concat(hunks(base,theirs).map(function(h){h.w=1;return h;}));
  all.sort(function(x,y){return x.s-y.s||x.e-y.e;});
  var out=[],pos=0,conflicts=0,k=0;
  while(k<all.length){
    var g=[all[k]],S=all[k].s,E=all[k].e;k++;
    while(k<all.length&&(all[k].s<E||all[k].s===S)){E=Math.max(E,all[k].e);g.push(all[k]);k++;}
    var gm=g.filter(function(h){return h.w===0;}),gt=g.filter(function(h){return h.w===1;});
    var mt=applyIn(base,gm,S,E),tt=applyIn(base,gt,S,E);
    out=out.concat(base.slice(pos,S));
    if(!gm.length)out=out.concat(tt);
    else if(!gt.length||mt.join('\n')===tt.join('\n'))out=out.concat(mt);
    else{out=out.concat(mt);conflicts++;}
    pos=E;
  }
  out=out.concat(base.slice(pos));
  return {md:out.join('\n'),merged:true,conflicts:conflicts};
}
function fmtTime(ms){if(!ms)return '';try{return new Date(ms).toLocaleString('zh-TW',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function setSync(t,off){var s=document.getElementById('sync');if(!s)return;s.textContent=t||'';s.classList.toggle('off',!!off);}
function fbErr(err,action){
  var c=err&&err.code||'';
  if(c==='permission-denied')note('沒有寫入權限：資料庫規則可能還沒更新。你的修改還在畫面上。');
  else if(c==='unavailable')note('目前連不上資料庫（網路中斷？）。你的修改還在畫面上，連線恢復後再按一次「儲存」。');
  else note(action+'沒有成功，請稍後再試。'+(c?'（'+esc(c)+'）':''));
}
function needUser(fn){fn();}
function editorName(){var v=(document.getElementById('editorName').value||'').trim();return v;}
function changeNote(base,mine){var hs=hunks(base,mine),n=0;hs.forEach(function(h){n+=Math.max(h.e-h.s,h.lines.length);});return '修改 '+n+' 行';}
function adopt(md){SRC.md=md;original=md.split('\n');ORIG=new Set(original);lines=original.slice();}
function saveFB(){
  if(!isDirty()||saving)return;
  var who=editorName();
  if(!who){note('請先在上方填「你的名字」，修改紀錄會記下是誰改的。');document.getElementById('editorName').focus();return;}
  var base=original.slice(),mine=cleanMd().split('\n'),info={};
  var msg=changeNote(base,mine);
  saving=true;updateEditUI();stash();
  fb.save(function(remote){
    info=merge3(base,mine,remote==null?base:remote.split('\n'));
    return {md:info.md,by:who,note:msg+(info.conflicts?'（'+info.conflicts+' 處與他人同時修改，採用此版）':'')};
  }).then(function(res){
    saving=false;editing=false;remoteMd=res.md;remoteRev=res.rev;
    try{localStorage.removeItem(SKEY);}catch(e){}
    adopt(res.md);draw();
    note('已儲存為第 '+res.rev+' 版，所有人的頁面會自動更新。'+(info.merged&&!info.conflicts?'別人剛存的修改也已自動合併進來。':'')+(info.conflicts?'有 '+info.conflicts+' 處你和別人改到同一段，已採用你的版本；對方的版本可以在「修改紀錄」找回。':''));
  },function(err){saving=false;updateEditUI();fbErr(err,'儲存');});
}
function seed(){
  needUser(function(){
    saving=true;updateEditUI();
    fb.save(function(remote){return {md:remote==null?EMBED:remote,by:editorName()||'籌備組',note:remote==null?'建立資料庫：第三版（精修排練版）':'（資料庫已存在，未變更內容）'};}).then(function(res){
      saving=false;remoteMd=res.md;remoteRev=res.rev;if(!editing){adopt(res.md);draw();}note('已把第三版存進資料庫（第 '+res.rev+' 版），之後大家的修改都會即時同步。');
    },function(err){saving=false;updateEditUI();fbErr(err,'建立資料庫');});
  });
}
function openHist(){
  var box=document.getElementById('hist'),ol=document.getElementById('histList');
  box.hidden=false;ol.innerHTML='<li>讀取中…</li>';
  fb.history(50).then(function(list){
    histData=list;
    if(!list.length){ol.innerHTML='<li>還沒有任何儲存紀錄。</li>';return;}
    ol.innerHTML=list.map(function(h,i){
      var now=h.md===remoteMd;
      return '<li><span class="hmeta">第 '+esc(h.rev)+' 版｜'+esc(fmtTime(h.at))+'｜'+esc(h.by||'（未具名）')+(now?'｜<strong>目前版本</strong>':'')+'<span class="hsub">'+esc(h.note||'')+'</span></span>'+(now?'':'<button class="btn" type="button" data-h="'+i+'">載回這版</button>')+'</li>';
    }).join('');
  },function(err){ol.innerHTML='<li>讀不到修改紀錄。</li>';fbErr(err,'讀取修改紀錄');});
}
function loadHist(i){
  var h=histData[i];if(!h)return;
  needUser(function(){
    if(remoteMd!=null&&!editing){original=remoteMd.split('\n');ORIG=new Set(original);}
    lines=h.md.split('\n');editing=true;document.getElementById('hist').hidden=true;stash();draw();
    note('已把第 '+esc(h.rev)+' 版載入編輯區，左邊有黃色標記的是和目前版本不同的行。確認沒問題按「儲存」就會成為最新版；不要的話按「放棄修改」。');
  });
}
function initFB(){
  if(fb||mode==='artifact')return;
  fb=window.KitchenFB;mode='firebase';setSync('連線中…');updateEditUI();
  fb.onScript(function(d,err){
    if(err){
      setSync('無法連線資料庫，顯示網頁內建的第三版',true);
      if(!remoteLoaded){mode='download';updateEditUI();offerRestore();}
      return;
    }
    var first=!remoteLoaded;remoteLoaded=true;
    if(!d){
      remoteMd=null;remoteRev=0;setSync('資料庫還沒有劇本，目前顯示內建的第三版',true);
      note('資料庫還是空的。<button class="btn" type="button" id="seedBtn">把第三版存進資料庫</button>');
      document.getElementById('seedBtn').onclick=seed;
      if(first)offerRestore();
      return;
    }
    remoteMd=d.md;remoteRev=d.rev;
    setSync('即時同步中｜第 '+d.rev+' 版'+(d.by?'・'+d.by:'')+(d.at?'・'+fmtTime(d.at):''));
    if(saving)return;
    if(!editing){if(d.md!==original.join('\n')||first){adopt(d.md);draw();}}
    else if(d.md!==original.join('\n'))note('有人剛存了新版本（第 '+d.rev+' 版）。你可以繼續改，按「儲存」時會自動合併。');
    if(first)offerRestore();
  });
}

draw();
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('artifact').then(function(ns){artifactNs=ns;mode=ns?'artifact':null;updateEditUI();if(ns)offerRestore();},function(){});
}else{
  if(window.KitchenFB)initFB();
  else{
    window.addEventListener('kitchen-fb-ready',initFB);
    var fallback=function(){if(!fb){mode='download';setSync('無法載入同步功能，改用下載新版',true);updateEditUI();offerRestore();}};
    window.addEventListener('kitchen-fb-failed',fallback);
    setTimeout(fallback,8000);
  }
}
})();
</script>
